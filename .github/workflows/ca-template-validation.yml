name: Community Apps template validation

on:
  pull_request:
    paths:
      - "ca_profile.xml"
      - "templates/**"
      - ".github/workflows/ca-template-validation.yml"
  push:
    branches: [main]
    paths:
      - "ca_profile.xml"
      - "templates/**"
      - ".github/workflows/ca-template-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate CA XML and template metadata
        shell: python
        run: |
          from pathlib import Path
          import ipaddress
          import re
          import sys
          import xml.etree.ElementTree as ET

          errors = []
          profile = Path("ca_profile.xml")
          if not profile.exists():
              errors.append("ca_profile.xml is missing")
          else:
              try:
                  root = ET.parse(profile).getroot()
                  if root.tag != "CommunityApplications":
                      errors.append("ca_profile.xml root must be CommunityApplications")
                  for tag in ("Profile", "Icon", "WebPage", "Forum"):
                      if not (root.findtext(tag) or "").strip():
                          errors.append(f"ca_profile.xml is missing {tag}")
              except Exception as exc:
                  errors.append(f"ca_profile.xml is invalid XML: {exc}")

          required = {
              "Name", "Repository", "Network", "WebUI", "Icon", "Overview",
              "Support", "Project", "TemplateURL", "ReadMe", "Category",
              "Changes", "Date", "MinVer", "License"
          }
          private_ip_re = re.compile(r"(?<!\d)(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})(?!\d)")
          secret_markers = re.compile(r"(?:sk-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,})")

          templates = sorted(Path("templates").glob("*.xml"))
          if not templates:
              errors.append("No templates/*.xml files found")

          for path in templates:
              text = path.read_text(encoding="utf-8")
              try:
                  root = ET.fromstring(text)
              except Exception as exc:
                  errors.append(f"{path}: invalid XML: {exc}")
                  continue
              if root.tag != "Container":
                  errors.append(f"{path}: root must be Container")
                  continue
              missing = [tag for tag in sorted(required) if not (root.findtext(tag) or "").strip()]
              if missing:
                  errors.append(f"{path}: missing required fields: {', '.join(missing)}")

              template_url = (root.findtext("TemplateURL") or "").strip()
              expected_suffix = f"/2CrAzYTV/multi-coin-paper-daytrader/main/{path.as_posix()}"
              if template_url and expected_suffix not in template_url:
                  errors.append(f"{path}: TemplateURL must point to the canonical file in 2CrAzYTV/multi-coin-paper-daytrader")

              for match in private_ip_re.findall(text):
                  try:
                      if ipaddress.ip_address(match).is_private:
                          errors.append(f"{path}: private IP address must not be shipped as a template default: {match}")
                  except ValueError:
                      pass
              if secret_markers.search(text):
                  errors.append(f"{path}: value resembling an API/access token found")

              for cfg in root.findall("Config"):
                  required_attr = (cfg.attrib.get("Required") or "").lower() == "true"
                  target = (cfg.attrib.get("Target") or "").upper()
                  value = (cfg.text or "").strip()
                  default = (cfg.attrib.get("Default") or "").strip()
                  sensitive = any(key in target for key in ("PASSWORD", "TOKEN", "SECRET", "API_KEY"))
                  if sensitive and not required_attr and (value or default):
                      errors.append(f"{path}: optional sensitive field {target} must have an empty shipped value/default")

          if errors:
              print("Community Apps validation failed:")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)
          print(f"Validated ca_profile.xml and {len(templates)} template(s).")
