services:
  paper-trading-bot:
    build: .
    container_name: paper-trading-bot
    user: "${PUID:-99}:${PGID:-100}"
    environment:
      PAPER_ONLY: "${PAPER_ONLY:-true}"
      STARTING_CAPITAL: "${STARTING_CAPITAL:-1000}"
      MAX_OPEN_POSITIONS: "${MAX_OPEN_POSITIONS:-4}"
      FEE_RATE: "${FEE_RATE:-0.0025}"
      SLIPPAGE_RATE: "${SLIPPAGE_RATE:-0.0005}"
      USE_ORDER_BOOK: "${USE_ORDER_BOOK:-true}"
      ENTRY_WINDOW: "${ENTRY_WINDOW:-55}"
      EXIT_WINDOW: "${EXIT_WINDOW:-20}"
      ATR_WINDOW: "${ATR_WINDOW:-20}"
      PAIRS: "${PAIRS:-BTC-EUR,ETH-EUR,SOL-EUR,XRP-EUR}"
      CANDLE_INTERVAL: "${CANDLE_INTERVAL:-1d}"
      HISTORY_BARS: "${HISTORY_BARS:-120}"
      BACKTEST_BARS: "${BACKTEST_BARS:-1440}"
      DATA_SOURCE: "${DATA_SOURCE:-demo}"
      FUSION_READ_API_KEY: "${FUSION_READ_API_KEY:-}"
      FUSION_BASE_URL: "${FUSION_BASE_URL:-https://api.fusion.bitpanda.com}"
      APP_LANGUAGE: "${APP_LANGUAGE:-en}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Europe/Berlin}"
      POLL_SECONDS: "${POLL_SECONDS:-300}"
      DATA_DIR: /data
      TZ: "${TZ:-Europe/Berlin}"
    ports:
      - "${WEB_PORT:-8787}:8787"
    volumes:
      - ./data:/data
    restart: unless-stopped
    read_only: true
    init: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
