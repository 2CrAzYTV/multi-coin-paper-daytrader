services:
  paper-trading-bot:
    build: .
    container_name: paper-trading-bot
    user: "${PUID:-99}:${PGID:-100}"
    environment:
      PAPER_ONLY: "${PAPER_ONLY:-true}"
      STARTING_CAPITAL: "${STARTING_CAPITAL:-1000}"
      RISK_PER_TRADE: "${RISK_PER_TRADE:-0.005}"
      MAX_AGGREGATE_RISK: "${MAX_AGGREGATE_RISK:-0.01}"
      MAX_DAILY_LOSS: "${MAX_DAILY_LOSS:-0.02}"
      HARD_DRAWDOWN: "${HARD_DRAWDOWN:-0.10}"
      MAX_OPEN_POSITIONS: "${MAX_OPEN_POSITIONS:-2}"
      MAX_TRADES_PER_DAY: "${MAX_TRADES_PER_DAY:-3}"
      FEE_RATE: "${FEE_RATE:-0.001}"
      SLIPPAGE_RATE: "${SLIPPAGE_RATE:-0.0005}"
      FAST_WINDOW: "${FAST_WINDOW:-9}"
      SLOW_WINDOW: "${SLOW_WINDOW:-21}"
      TREND_FAST_WINDOW: "${TREND_FAST_WINDOW:-20}"
      TREND_SLOW_WINDOW: "${TREND_SLOW_WINDOW:-50}"
      ATR_WINDOW: "${ATR_WINDOW:-14}"
      RSI_WINDOW: "${RSI_WINDOW:-14}"
      STOP_ATR_MULTIPLE: "${STOP_ATR_MULTIPLE:-1.5}"
      MINIMUM_STOP_PCT: "${MINIMUM_STOP_PCT:-0.006}"
      TAKE_PROFIT_R: "${TAKE_PROFIT_R:-2.0}"
      TRAILING_TRIGGER_R: "${TRAILING_TRIGGER_R:-1.0}"
      AUTO_COIN_SCAN: "${AUTO_COIN_SCAN:-true}"
      CANDLE_INTERVAL: "${CANDLE_INTERVAL:-15m}"
      TREND_INTERVAL: "${TREND_INTERVAL:-1h}"
      HISTORY_BARS: "${HISTORY_BARS:-500}"
      BACKTEST_BARS: "${BACKTEST_BARS:-5000}"
      DATA_SOURCE: "${DATA_SOURCE:-demo}"
      FUSION_READ_API_KEY: "${FUSION_READ_API_KEY:-}"
      FUSION_BASE_URL: "${FUSION_BASE_URL:-https://api.fusion.bitpanda.com}"
      APP_LANGUAGE: "${APP_LANGUAGE:-en}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Europe/Berlin}"
      POLL_SECONDS: "${POLL_SECONDS:-60}"
      SESSION_CLOSE_HOUR: "${SESSION_CLOSE_HOUR:-23}"
      SESSION_CLOSE_MINUTE: "${SESSION_CLOSE_MINUTE:-45}"
      COOLDOWN_MINUTES: "${COOLDOWN_MINUTES:-45}"
      DATA_DIR: /data
      TZ: "${TZ:-Europe/Berlin}"
    ports:
      - "${WEB_PORT:-8787}:8787"
    volumes:
      - ./data:/data
    restart: unless-stopped
    read_only: true
    init: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
